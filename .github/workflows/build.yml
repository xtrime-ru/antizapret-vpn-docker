name: CI

on:
  pull_request:
    branches: [dev, 'v[0-9]+']
    paths: [versions.json]
  push:
    branches: [dev, 'v[0-9]+']
    paths: [versions.json]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the current image tags
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
      services: ${{ steps.plan.outputs.services }}
      dependencies: ${{ steps.dependencies.outputs.images }}
      integration_artifacts: ${{ steps.dependencies.outputs.artifacts }}
      cache_branch: ${{ steps.plan.outputs.cache_branch }}
    steps:
      - uses: actions/checkout@v6
      - id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PUBLISH_REQUESTED: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        shell: bash
        run: |
          cache_branch=
          if [[ "$GITHUB_EVENT_NAME" != pull_request && "$GITHUB_REF_TYPE" == branch && "$GITHUB_REF_NAME" =~ ^(dev|v[0-9]+)$ ]]; then
            cache_branch="$GITHUB_REF_NAME"
          fi

          previous='{"images":[]}'
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            : # Select all versions.
          elif [[ "$BASE_SHA" =~ ^0+$ ]]; then
            previous=$(cat versions.json)
          else
            git cat-file -e "$BASE_SHA^{commit}" || git fetch --depth=1 --no-tags origin "$BASE_SHA"
            if git cat-file -e "$BASE_SHA:versions.json" 2>/dev/null; then
              previous=$(git show "$BASE_SHA:versions.json")
            fi
          fi
          images=$(jq -c --argjson old "$previous" '
            if (.images | type != "array") or any(.images[];
              any(.name,.repository,.version,.source,.compose,.target; type != "string" or length == 0)
              or (.aliases | type != "array" or any(.[]; type != "string"))
              or (.name | test("^[a-z0-9][a-z0-9-]*$") | not))
            then error("Invalid versions.json") else
              ($old.images | INDEX(.name)) as $previous |
              [.images[] | select(.version != $previous[.name].version)]
            end' versions.json)
          releases='[]'
          if [[ -n "$cache_branch" && "$PUBLISH_REQUESTED" == true ]]; then
            releases=$(jq -c --arg branch "$cache_branch" '
              map(. as $image | {name, tags: [
                (.version, (.aliases[] | select($branch != "dev"))) as $tag |
                "xtrime/\($image.repository):\($tag)",
                "ghcr.io/xtrime-ru/\($image.ghcr_repository // $image.repository):\($tag)"
              ]})' <<< "$images")
          fi
          services=$(jq -c 'map(.name)' <<< "$images")
          printf 'services=%s\ncache_branch=%s\nreleases=%s\n' \
            "$services" "$cache_branch" "$releases" >> "$GITHUB_OUTPUT"
          {
            echo '### Build and test on amd64 and arm64'
            jq -r 'if length == 0 then "No image versions changed." else .[] | "- " + .name + ":" + .version end' <<< "$images"
            echo
            echo '### Publication'
            jq -r 'if length == 0 then "Publication disabled." else .[].tags[] | "- " + . end' <<< "$releases"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: docker/login-action@v4
        if: steps.plan.outputs.services != '[]'
        with: &ghcr_login
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: dependencies
        if: steps.plan.outputs.services != '[]'
        env:
          SERVICES: ${{ steps.plan.outputs.services }}
        shell: bash
        run: |
          dependencies=$(jq -er --argjson built "$SERVICES" '
            .images[] | select(.name == "antizapret" or .name == "adguard" or .name == "coredns") |
            . as $image | [.name, .version, (if ($built | index($image.name)) then "build" else "pull" end),
              "ghcr.io/xtrime-ru/" + (.ghcr_repository // .repository), "xtrime/" + .repository] | @tsv
          ' versions.json)
          images=$(while IFS=$'\t' read -r name version source ghcr hub; do
            if [[ "$source" == build ]]; then
              jq -cn --arg name "$name" '{name:$name}'
              continue
            fi
            ref=
            for repo in "$ghcr" "$hub"; do
              if digest=$(docker buildx imagetools inspect "$repo:$version" --format '{{.Manifest.Digest}}') &&
                 [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
                ref="$repo@$digest"
                break
              fi
            done
            if [[ -z "$ref" ]]; then
              echo "::error::Cannot resolve a digest for integration dependency $name:$version" >&2
              exit 1
            fi
            jq -cn --arg name "$name" --arg ref "$ref" '{name:$name,ref:$ref}'
          done <<< "$dependencies" | jq -sc '.')
          artifacts=$(jq -r 'map(select(.ref == null).name) | join("|")' <<< "$images")
          printf 'images=%s\nartifacts=%s\n' "$images" "$artifacts" >> "$GITHUB_OUTPUT"
          {
            echo
            echo '### Integration images'
            jq -r '.[] | "- " + .name + ": " + (.ref // "OCI artifact from this run")' <<< "$images"
          } >> "$GITHUB_STEP_SUMMARY"

  service:
    name: ${{ matrix.service }} / ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.services != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}
        arch: [amd64, arm64]
    uses: ./.github/workflows/service.yml
    with:
      service: ${{ matrix.service }}
      arch: ${{ matrix.arch }}
      cache_branch: ${{ needs.plan.outputs.cache_branch }}

  integration:
    name: Integration / ${{ matrix.arch }}
    needs: [plan, service]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-docker-action@v5
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: actions/download-artifact@v7
        if: needs.plan.outputs.integration_artifacts != ''
        with:
          pattern: oci-@(${{ needs.plan.outputs.integration_artifacts }})_${{ matrix.arch }}
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - uses: docker/login-action@v4
        with: *ghcr_login
      - name: Load tested images and pinned dependencies
        env:
          ARCH: ${{ matrix.arch }}
          DEPENDENCIES: ${{ needs.plan.outputs.dependencies }}
        shell: bash
        run: |
          jq -r '.[] | [.name, .ref] | @tsv' <<< "$DEPENDENCIES" |
          while IFS=$'\t' read -r name ref; do
            if [[ -z "$ref" ]]; then
              docker image load --input "$RUNNER_TEMP/images/$name-$ARCH.tar"
            else
              docker pull --platform "linux/$ARCH" "$ref"
              docker image tag "$ref" "antizapret-$name:ci"
            fi
          done
      - name: Test DNS across CoreDNS, dnsmap and AdGuard
        run: scripts/ci-integration.sh

  publish:
    name: Publish / ${{ matrix.name }}
    needs: [plan, integration]
    if: needs.plan.outputs.releases != '[]'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.releases) }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: oci-${{ matrix.name }}_@(amd64|arm64)
          path: ${{ runner.temp }}/images
          merge-multiple: true
      - name: Install regctl
        run: |
          curl -fsSL https://github.com/regclient/regclient/releases/download/v0.11.6/regctl-linux-amd64 -o "$RUNNER_TEMP/regctl"
          chmod +x "$RUNNER_TEMP/regctl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - uses: docker/login-action@v4
        with: *ghcr_login
      - uses: docker/login-action@v4
        with:
          username: xtrime
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Publish tested images
        env:
          SERVICE: ${{ matrix.name }}
          TAGS: ${{ toJSON(matrix.tags) }}
        run: scripts/ci-publish.sh "$RUNNER_TEMP/images"
