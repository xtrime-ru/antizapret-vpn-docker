networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 10.200.0.0/24
  # IPv6 egress network for az-local. Created automatically by Compose on
  # `docker compose up` (no external network, no manual `docker network create`).
  # Automatic ULA IPv6 subnet allocation (no explicit subnet) requires Docker
  # Engine 27.0.0+; older engines need an explicit IPv6 subnet in ipam.config.
  # Docker allocates a unique ULA IPv6 subnet per installation, so independent
  # installations do not collide. Only az-local is attached; other services keep
  # using the default application network.
  ipv6:
    driver: bridge
    enable_ipv6: true

services:
  az-local:
    hostname: az-local.antizapret
    networks:
      default:
        aliases:
          - az-local
          - az-local.antizapret
          - az-world
          - az-world.antizapret
      ipv6: {}
    extends:
      file: services/antizapret/docker-compose.yml
      service: antizapret
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [ node.labels.location == local ]
    environment:
      - CLIENT=az-local
      - AZ_SUBNET=14.16.0.0/15
      - ASN_FILES=/root/antizapret/result/asn.txt;/root/antizapret/result/asn-world.txt
  adguard:
    extends:
      file: services/adguard/docker-compose.yml
      service: adguard
  coredns:
    extends:
      file: services/coredns/docker-compose.yml
      service: coredns
  https:
    extends:
      file: services/https/docker-compose.yml
      service: https
  firewall:
    extends:
      file: services/firewall/docker-compose.yml
      service: firewall
