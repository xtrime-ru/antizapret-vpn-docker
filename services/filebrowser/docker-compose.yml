services:
  filebrowser:
    entrypoint: ["/usr/local/lib/docktinel/entrypoint"]
    command: ["/init.sh"]
    init: true
    environment:
      - DOCKTINEL_STARTUP_TIMEOUT=10m
    hostname: filebrowser.antizapret
    restart: unless-stopped
    image: xtrime/antizapret-vpn-filebrowser:6.12.4
    build: 
      context: .
      args:
        DOCKTINEL_IMAGE: ${DOCKTINEL_IMAGE:-ghcr.io/xtrime-ru/docktinel:0.3.1}
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "docktinel", "healthcheck", "--startup-grace", "10m"]
      interval: 10s
      timeout: 5s
      start_period: 10m
      start_interval: 1s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: 3
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - $PWD/config/antizapret/custom:/srv
    depends_on:
      - az-local
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [ node.labels.location == local ]
