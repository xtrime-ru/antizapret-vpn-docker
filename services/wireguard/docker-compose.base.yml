services:
  base:
    entrypoint: ["/usr/local/lib/docktinel/entrypoint"]
    command: ["/init.sh"]
    init: true
    restart: unless-stopped
    image: xtrime/antizapret-vpn-wireguard:6.12.2
    build:
      context: .
      args:
        - DOCKTINEL_IMAGE=${DOCKTINEL_IMAGE:-ghcr.io/xtrime-ru/docktinel:0.2.0}
        - IMAGE=ghcr.io/wg-easy/wg-easy:15.5.0
        - AWG_TOOLS_VERSION=v3.1.20260812
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: 3
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "docktinel", "healthcheck", "--startup-grace", "10m"]
      interval: 10s
      timeout: 5s
      start_period: 10m
      start_interval: 1s
      retries: 3
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    depends_on:
      - az-local
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - $PWD/config/antizapret/result:/opt/antizapret/result
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [ node.labels.location == local ]
    environment:
      - TINI_KILL_PROCESS_GROUP=1
      - DOCKTINEL_STARTUP_TIMEOUT=10m
      - PORT=51821
      - INSECURE=true
      - DISABLE_IPV6=true
      - WG_PORT=51820
      - MTU=1280
      - WG_DEFAULT_DNS=14.16.0.1
      - AZ_SUBNET=14.16.0.0/14
      - WG_PERSISTENT_KEEPALIVE=25
      - BGP_ENABLE=false
      - |
        ROUTES=
        ocserv:10.1.164.0/24;
        openvpn:10.1.165.0/24;
        wireguard:10.1.166.0/24;
        wireguard-amnezia:10.1.167.0/24;
        adguard:14.16.0.1;
        az-local:14.16.0.0/15;
        az-world:14.18.0.0/15;
