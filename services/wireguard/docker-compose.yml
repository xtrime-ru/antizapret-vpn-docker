services:
  wireguard:
    extends:
      file: docker-compose.base.yml
      service: base
    hostname: wireguard.antizapret
    ports:
      - "51820:51820/udp"
    environment:
      - WG_PORT=51820
      - WG_DEFAULT_ADDRESS=10.1.166.x
    volumes:
      - $PWD/config/wireguard:/etc/wireguard

  wireguard-amnezia:
    extends:
      file: docker-compose.base.yml
      service: base
    hostname: wireguard-amnezia.antizapret
    ports:
      - "51830:51830/udp"
    environment:
      - WG_PORT=51830
      - WG_DEFAULT_ADDRESS=10.1.167.x
      - EXPERIMENTAL_AWG=true
      - OVERRIDE_AUTO_AWG=awg
      - JC=3
      - JMIN=20
      - JMAX=100
      - I1=<b 0xc1000000010ba52815f1e651c9853bb0c407c8e68115f7477200b22f57d6><rc 15><t><r 108>
      - I2=<b 0xc00000000109167714f9286987879212a273601fb819d130d8692555e48d3290f1650058a2c60c><rc 15><t><r 156>
      - I3=<b 0xc30000000112d8e1a703eb312defe62edeb558554baa84df10162edc83b2512e35b0cb240939c5450b00e9dd8daa><rc 17><t><r 147>
      - I4=<b 0xc10000000110b7f9452535a4ecd98cc9038d9b1a764e0f14980f89aa642089e04f77aa1f1a4000c94524ae><rc 18><t><r 147>
      - I5=<b 0xc0000000010d7da384bc5a868f698cd2d72abe00129c253ddefa4780ca8912db0252f2962608a8f99bd3cf><rc 12><t><r 186>
    volumes:
      - $PWD/config/wireguard_amnezia:/etc/wireguard
