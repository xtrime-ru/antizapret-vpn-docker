services:
  openvpn:
    entrypoint: ["/usr/local/lib/docktinel/entrypoint"]
    command: ["/opt/app/docker-entrypoint.sh"]
    hostname: openvpn.antizapret
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    devices:
      - /dev/net/tun:/dev/net/tun
    image: xtrime/antizapret-vpn-openvpn:6.12.3
    build:
      context: .
      args:
        DOCKTINEL_IMAGE: ${DOCKTINEL_IMAGE:-ghcr.io/xtrime-ru/docktinel:0.2.0}
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "docktinel", "healthcheck", "--startup-grace", "10m"]
      interval: 10s
      timeout: 5s
      start_period: 10m
      start_interval: 1s
      retries: 3
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - $PWD/config/openvpn:/etc/openvpn
      - $PWD/config/antizapret/result:/opt/antizapret/result
    ports:
      - "1194:1194/tcp"
      - "1194:1194/udp"
    depends_on:
      - openvpn-ui
      - az-local
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [ node.labels.location == local ]
    environment:
      - TINI_KILL_PROCESS_GROUP=1
      - DOCKTINEL_STARTUP_TIMEOUT=10m
      - OBFUSCATE_TYPE=1
      - |
        ROUTES=
        ocserv:10.1.164.0/24;
        openvpn:10.1.165.0/24;
        wireguard:10.1.166.0/24;
        wireguard-amnezia:10.1.167.0/24;
        adguard:14.16.0.1;
        az-local:14.16.0.0/15;
        az-world:14.18.0.0/15;

  openvpn-ui:
    entrypoint: ["/usr/local/lib/docktinel/entrypoint"]
    command: ["/opt/run.sh"]
    init: true
    hostname: openvpn-ui.antizapret
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    image: xtrime/antizapret-vpn-openvpn-ui:6.12.2
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "docktinel", "healthcheck", "--startup-grace", "10m"]
      interval: 10s
      timeout: 5s
      start_period: 10m
      start_interval: 1s
      retries: 3
    build:
      context: .
      args:
        DOCKTINEL_IMAGE: ${DOCKTINEL_IMAGE:-ghcr.io/xtrime-ru/docktinel:0.2.0}
      dockerfile: Dockerfile-ui
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - $PWD/config/openvpn/db:/opt/openvpn-ui/db
      - $PWD/config/openvpn/pki:/usr/share/easy-rsa/pki
      - $PWD/config/openvpn:/etc/openvpn
    environment:
      - TINI_KILL_PROCESS_GROUP=1
      - DOCKTINEL_STARTUP_TIMEOUT=10m
      - OPENVPN_ADMIN_USERNAME=admin
      - OPENVPN_ADMIN_PASSWORD=gagaZush
      - AZ_SUBNET=14.16.0.0
    depends_on:
      - az-local
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [ node.labels.location == local ]
