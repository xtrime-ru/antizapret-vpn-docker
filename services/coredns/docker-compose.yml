services:
  coredns:
    entrypoint: ["/usr/local/lib/docktinel/entrypoint"]
    command: ["/coredns", "-conf", "/Corefile"]
    image: xtrime/antizapret-vpn-coredns:6.12.4
    hostname: coredns.antizapret
    restart: unless-stopped
    init: true
    environment:
      - TINI_KILL_PROCESS_GROUP=1
      - DOCKTINEL_STARTUP_TIMEOUT=10m
    build: 
      context: .
      args:
        DOCKTINEL_IMAGE: ${DOCKTINEL_IMAGE:-ghcr.io/xtrime-ru/docktinel:0.2.0}
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: 3
    volumes:
      - /etc/localtime:/etc/localtime:ro
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "docktinel", "healthcheck", "--startup-grace", "10m"]
      interval: 10s
      timeout: 5s
      start_period: 10m
      start_interval: 1s
      retries: 3
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [ node.labels.location == local ]
    depends_on:
      - az-local
