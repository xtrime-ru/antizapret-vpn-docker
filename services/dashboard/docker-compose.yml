services:
  dashboard:
    entrypoint: ["/usr/local/lib/docktinel/entrypoint"]
    command: ["lighttpd", "-D", "-f", "/etc/lighttpd/lighttpd.conf"]
    init: true
    hostname: dashboard.antizapret
    restart: unless-stopped
    image: xtrime/antizapret-vpn-dashboard:6.12.2
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "docktinel", "healthcheck", "--startup-grace", "10m"]
      interval: 10s
      timeout: 5s
      start_period: 10m
      start_interval: 1s
      retries: 3
    build: 
      context: .
      args:
        DOCKTINEL_IMAGE: ${DOCKTINEL_IMAGE:-ghcr.io/xtrime-ru/docktinel:0.2.0}
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TINI_KILL_PROCESS_GROUP=1
      - DOCKTINEL_STARTUP_TIMEOUT=10m
      - DASHBOARD_USERNAME=admin
      - DASHBOARD_PASSWORD=password

      # DASHBOARD_SERVICE_N=name:external_port:internal_hostname:internal_port
      - DASHBOARD_SERVICE_1=AdGuard:1443:adguard.antizapret:3000
      - DASHBOARD_SERVICE_2=File Browser:2443:filebrowser.antizapret:80
      - DASHBOARD_SERVICE_3=OpenVPN UI:3443:openvpn-ui.antizapret:8080
      - DASHBOARD_SERVICE_4=WireGuard:4443:wireguard.antizapret:51821
      - DASHBOARD_SERVICE_5=WireGuard Amnezia:5443:wireguard-amnezia.antizapret:51821
    depends_on:
      - az-local
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [ node.labels.location == local ]
