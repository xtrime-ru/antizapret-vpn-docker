services:
  antizapret:
    image: xtrime/antizapret-vpn:6.10.1
    restart: unless-stopped
    init: true
    cap_add:
      - NET_ADMIN
      - MKNOD
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.conf.all.route_localnet=1
    extra_hosts:
      - "raw.githubusercontent.com=185.199.108.133"
      - "github.io=185.199.110.153"
      - "xtrime-ru.github.io=185.199.110.153"
      - "adguardteam.github.io=185.199.110.153"
    build: 
      context: ../..
      dockerfile: services/antizapret/Dockerfile
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: 3
    healthcheck:
      test: /healthcheck.sh
      interval: 10s
      timeout: 15m
      start_period: 10m
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - $PWD/config/antizapret/custom:/root/antizapret/config/custom
      - $PWD/config/antizapret/result:/root/antizapret/result
      - $PWD/config/antizapret/iptables:/root/antizapret/iptables
      - $PWD/config/antizapret/warp:/var/lib/cloudflare-warp
      - $PWD/config/antizapret/zapret2:/opt/zapret2/config
      - $PWD/config/antizapret/custom/ipv6-egress-domains-local.txt:/root/antizapret/config/custom/ipv6-egress-domains-local.txt
      - $PWD/config/antizapret/custom/ipv6-egress-domains-world.txt:/root/antizapret/config/custom/ipv6-egress-domains-world.txt
      - $PWD/config/adguard/conf:/opt/adguardhome/conf
      - $PWD/config/adguard/work:/opt/adguardhome/work
    environment:
      - TINI_KILL_PROCESS_GROUP=1
      - |
        ROUTES=
        ocserv:10.1.164.0/24;
        openvpn:10.1.165.0/24;
        wireguard:10.1.166.0/24;
        wireguard-amnezia:10.1.167.0/24;
        adguard:14.16.0.1;
        az-local:14.16.0.0/15;
        az-world:14.18.0.0/15;
      - DNS=adguard
      - CLIENT
      - DOALL_DISABLED
      - IPTABLES_SAVE_DISABLED
      - WARP_ENABLED=0
      - ZAPRET_ENABLED=0
      - ZAPRET_CONFIG
      # IPv6 egress configuration (per exit node)
      - IPV6_EGRESS_LOCAL_ENABLED=0
      - IPV6_EGRESS_LOCAL_FILE=/root/antizapret/config/custom/ipv6-egress-domains-local.txt
      - IPV6_EGRESS_LOCAL_MODE=adguard_only
      - IPV6_EGRESS_LOCAL_RESERVE_COUNT=100
      - IPV6_TRANSLATOR_LOCAL_PORT=9000
      - IPV6_EGRESS_WORLD_ENABLED=0
      - IPV6_EGRESS_WORLD_FILE=/root/antizapret/config/custom/ipv6-egress-domains-world.txt
      - IPV6_EGRESS_WORLD_MODE=adguard_only
      - IPV6_EGRESS_WORLD_RESERVE_COUNT=100
      - IPV6_TRANSLATOR_WORLD_PORT=9000
      - |
        IPS_URL=
        https://xtrime-ru.github.io/antizapret-vpn-docker/lists/ips.txt;
      - |
        IPS_WORLD_URL=
        https://xtrime-ru.github.io/antizapret-vpn-docker/lists/ips-world.txt;
      - |
        ASN_URL=
        https://xtrime-ru.github.io/antizapret-vpn-docker/lists/asn.txt;
      - |
        ASN_WORLD_URL=
        https://xtrime-ru.github.io/antizapret-vpn-docker/lists/asn-world.txt;
