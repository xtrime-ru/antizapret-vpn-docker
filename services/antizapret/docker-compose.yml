services:
  antizapret:
    image: xtrime/antizapret-vpn:6.7.10
    restart: unless-stopped
    init: true
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    extra_hosts:
      - "raw.githubusercontent.com=185.199.108.133"
    build: 
      context: .
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: 3
    healthcheck:
      test: /healthcheck.sh
      interval: 10s
      timeout: 15m
      start_period: 10m
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - $PWD/config/antizapret/custom:/root/antizapret/config/custom
      - $PWD/config/antizapret/result:/root/antizapret/result
      - $PWD/config/antizapret/iptables:/root/antizapret/iptables
      - $PWD/config/antizapret/zapret2:/opt/zapret2/config
      - $PWD/config/adguard/conf:/opt/adguardhome/conf
      - $PWD/config/adguard/work:/opt/adguardhome/work
    environment:
      - TINI_KILL_PROCESS_GROUP=1
      - |
        ROUTES=
        openvpn:10.1.165.0/24;
        wireguard:10.1.166.0/24;
        wireguard-amnezia:10.1.167.0/24;
        adguard:14.16.0.1;
        az-local:14.16.0.0/15;
        az-world:14.18.0.0/15;
      - DNS=adguard
      - CLIENT
      - DOALL_DISABLED
      - IPTABLES_SAVE_DISABLED
      - ZAPRET_ENABLED=0
      - ZAPRET_CONFIG
      - |
        IPS_URL=
        https://xtrime-ru.github.io/antizapret-vpn-docker/lists/ips.txt;
      - |
        IPS_WORLD_URL=
        https://xtrime-ru.github.io/antizapret-vpn-docker/lists/ips-world.txt;
      - |
        ASN_URL=
        https://xtrime-ru.github.io/antizapret-vpn-docker/lists/asn.txt;
      - |
        ASN_WORLD_URL=
        https://xtrime-ru.github.io/antizapret-vpn-docker/lists/asn-world.txt;
