services:
  ocserv:
    init: true
    restart: unless-stopped
    image: xtrime/antizapret-vpn-ocserv:6.7.6
    hostname: ocserv.antizapret
    build:
      context: .
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: 3
    healthcheck:
      test: /healthcheck.sh
      interval: 10s
      timeout: 15s
      start_period: 3m
      start_interval: 5s
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - "/dev/net/tun:/dev/net/tun"
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    depends_on:
      - az-local
      - https
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [ node.labels.location == local ]
      resources:
        limits:
          memory: 200M
    environment:
      - OC_DEFAULT_ADDRESS=10.1.164.x
      - OC_PORT=443
      - OC_USER=admin
      - OC_USERPASS=password
      - OC_SECRET=kvn
      - |
        ROUTES=
        ocserv:10.1.164.0/24;
        openvpn:10.1.165.0/24;
        wireguard:10.1.166.0/24;
        wireguard-amnezia:10.1.167.0/24;
        adguard:14.16.0.1;
        az-local:14.16.0.0/15;
        az-world:14.18.0.0/15;
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - $PWD/config/ocserv:/etc/ocserv
      - $PWD/config/antizapret/result:/opt/antizapret/result
      - $PWD/config/https/data/ocserv:/https-data/ocserv:ro
    ports:
      - "443:443/udp"
