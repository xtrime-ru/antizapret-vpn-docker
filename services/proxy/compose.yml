services:
  proxy:
    image: xtrime/antizapret-vpn-proxy:6.7.4
    init: true
    build:
      context: .
      args:
        - IMAGE=ghcr.io/tarampampam/3proxy:2
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: 3
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      - PRIMARY_RESOLVER=14.16.0.1
      - PROXY_LOGIN=
      - PROXY_PASSWORD=
      - PROXY_PORT=8180
      - SOCKS_PORT=8118
      - EXTRA_ACCOUNTS=
      - |
        ROUTES=
        ocserv:10.1.164.0/24;
        openvpn:10.1.165.0/24;
        wireguard:10.1.166.0/24;
        wireguard-amnezia:10.1.167.0/24;
        adguard:14.16.0.1;
        az-local:14.16.0.0/15;
        az-world:14.18.0.0/15;
