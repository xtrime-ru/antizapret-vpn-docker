services:
  https:
    restart: unless-stopped
    image: xtrime/antizapret-vpn-https:6.7.0
    build: 
      context: .
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    ports:
      - "80:80"
      - "443:443/tcp"
      - "1443:1443"
      - "2443:2443"
      - "3443:3443"
      - "4443:4443"
      - "5443:5443"
      - "8143:8143"
      - "8243:8243"
    environment:
      # Optional domain for HTTPS services. Public IPv4 is used when empty.
      - PROXY_DOMAIN=
      # Optional Let's Encrypt account email.
      - PROXY_EMAIL=
      - PROXY_IP=${PROXY_IP:-}
      # PROXY_SERVICE_N=external_port:internal_hostname:internal_port
      - PROXY_SERVICE_1=Dashboard:443:dashboard.antizapret:80
      - PROXY_SERVICE_2=AdGuard:1443:adguard.antizapret:3000
      - PROXY_SERVICE_3=File Browser:2443:filebrowser.antizapret:80
      - PROXY_SERVICE_4=OpenVPN UI:3443:openvpn-ui.antizapret:8080
      - PROXY_SERVICE_5=WireGuard:4443:wireguard.antizapret:51821
      - PROXY_SERVICE_6=WireGuard Amnezia:5443:wireguard-amnezia.antizapret:51821
      - PROXY_SERVICE_7=HTTP PROXY LOCAL:8143:proxy-local.antizapret:8180
      - PROXY_SERVICE_8=HTTP PROXY WORLD:8243:proxy-world.antizapret:8180
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - $PWD/config/https/data:/data
      - $PWD/config/https/config:/config
    depends_on:
      - az-local
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [ node.labels.location == local ]
