services:
  adguard:
    image: xtrime/antizapret-vpn-adguard:6.8.2
    build:
      context: .
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
    hostname: adguard.antizapret
    restart: unless-stopped
    init: true
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.conf.all.route_localnet=1
    extra_hosts:
      - "raw.githubusercontent.com=185.199.108.133"
      - "github.io=185.199.110.153"
      - "xtrime-ru.github.io=185.199.110.153"
      - "adguardteam.github.io=185.199.110.153"
    healthcheck:
      test: (timeout 10m /root/healthcheck.sh || kill -TERM 1) 2>&1 | tee /proc/1/fd/1
      interval: 10s
      timeout: 15m
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: 3
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - $PWD/config/adguard/conf:/opt/adguardhome/conf
      - $PWD/config/adguard/work:/opt/adguardhome/work
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [ node.labels.location == local ]
    depends_on:
      - coredns
      - az-local
    environment:
      - |
        ROUTES=
        ocserv:10.1.164.0/24;
        openvpn:10.1.165.0/24;
        wireguard:10.1.166.0/24;
        wireguard-amnezia:10.1.167.0/24;
        adguard:14.16.0.1;
        az-local:14.16.0.0/15;
        az-world:14.18.0.0/15;
      - ADGUARDHOME_PORT
      - ADGUARDHOME_USERNAME
      - ADGUARDHOME_PASSWORD
