networks:
  default:
    driver: overlay
    driver_opts:
      encrypted: "${DOCKER_ENC:-"true"}"
      com.docker.network.driver.mtu: "${DOCKER_MTU:-1500}"
  host:
    name: host
    external: true

services:
  az-local:
    networks:
      default:
        aliases: !override
          - az-local
          - az-local.antizapret
    environment:
      - AZ_SUBNET=14.16.0.0/15
      - IPTABLES_SAVE_DISABLED=${IPTABLES_SAVE_DISABLED:-0}
      - IPS_URL=${IPS_URL}
      - IPS_WORLD_URL=${IPS_WORLD_URL}
      - ASN_URL=${ASN_URL}
      - ASN_WORLD_URL=${ASN_WORLD_URL}
      - ROUTES=${ROUTES}
    extra_hosts:
      - "raw.githubusercontent.com:${GITHUB_RAW_IP}"

  az-world:
    hostname: az-world.antizapret
    networks:
      default:
        aliases:
          - az-world
          - az-world.antizapret
    extends:
      file: services/antizapret/docker-compose.yml
      service: antizapret
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [ node.labels.location == world ]
    environment:
      - CLIENT=az-world
      - AZ_SUBNET=14.18.0.0/15
      - IPTABLES_SAVE_DISABLED=${IPTABLES_SAVE_DISABLED:-0}
      - IPS_URL=${IPS_URL}
      - IPS_WORLD_URL=${IPS_WORLD_URL}
      - ASN_URL=${ASN_URL}
      - ASN_WORLD_URL=${ASN_WORLD_URL}
      - ROUTES=${ROUTES}
    extra_hosts:
      - "raw.githubusercontent.com:${GITHUB_RAW_IP}"

  adguard:
    environment:
      - AZ_WORLD_ENABLED=1

  firewall:
    network_mode: !reset null
    networks:
      - host
