networks:
  default:
    driver: overlay
    driver_opts:
      encrypted: "true"
      com.docker.network.driver.mtu: 1500
  host:
    name: host
    external: true

services:
  az-local:
    networks:
      default:
        aliases: !override
          - az-local
          - az-local.antizapret
    environment:
      - AZ_SUBNET=14.16.0.0/15
      - ASN_FILES=/root/antizapret/result/asn.txt
      # IPv6 egress for az-local (Singlebox or Swarm local node)
      - IPV6_EGRESS_LOCAL_ENABLED=0
      - IPV6_EGRESS_LOCAL_FILE=/root/antizapret/config/custom/ipv6-egress-domains-local.txt
      - IPV6_EGRESS_LOCAL_MODE=adguard_only
      - IPV6_EGRESS_LOCAL_RESERVE_COUNT=100
      - IPV6_TRANSLATOR_LOCAL_PORT=9000

  az-world:
    hostname: az-world.antizapret
    networks:
      default:
        aliases:
          - az-world
          - az-world.antizapret
    extends:
      file: services/antizapret/docker-compose.yml
      service: antizapret
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [ node.labels.location == world ]
    environment:
      - CLIENT=az-world
      - AZ_SUBNET=14.18.0.0/15
      - ASN_FILES=/root/antizapret/result/asn-world.txt
      # IPv6 egress for az-world (Swarm world node only)
      - IPV6_EGRESS_WORLD_ENABLED=0
      - IPV6_EGRESS_WORLD_FILE=/root/antizapret/config/custom/ipv6-egress-domains-world.txt
      - IPV6_EGRESS_WORLD_MODE=adguard_only
      - IPV6_EGRESS_WORLD_RESERVE_COUNT=100
      - IPV6_TRANSLATOR_WORLD_PORT=9000

  adguard:
    environment:
      - AZ_WORLD_ENABLED=1

  firewall:
    network_mode: !reset null
    networks:
      - host
