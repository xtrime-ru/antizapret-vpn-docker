services:
  adguard:
    environment:
      - ADGUARDHOME_USERNAME=admin
      - ADGUARDHOME_PASSWORD=password

  https:
    environment:
      # Optional domain for HTTPS services. Public IPv4 is used when empty.
      - PROXY_DOMAIN=
      # Optional Let's Encrypt account email.
      - PROXY_EMAIL=
      # Use selfsigned to disable ACME requests on local installations.
      - PROXY_CERT_MODE=auto
      # Use the staging directory while testing certificate issuance.
      # - PROXY_ACME_CA=https://acme-staging-v02.api.letsencrypt.org/directory

  # cloak:
  #   extends:
  #     file: services/cloak/docker-compose.yml
  #     service: cloak

  dashboard:
    extends:
      file: services/dashboard/docker-compose.yml
      service: dashboard
    environment:
      - DASHBOARD_USERNAME=admin
      - DASHBOARD_PASSWORD=password

  filebrowser:
    extends:
      file: services/filebrowser/docker-compose.yml
      service: filebrowser
    environment:
      - FILEBROWSER_USERNAME=admin
      - FILEBROWSER_PASSWORD=antizapret-browser

  ocserv:
    extends:
      file: services/ocserv/compose.yml
      service: ocserv
    environment:
      - OC_USER=admin
      - OC_USERPASS=strongpassword

  openvpn:
    extends:
      file: services/openvpn/docker-compose.yml
      service: openvpn
    depends_on:
      - openvpn-ui

  openvpn-ui:
    extends:
      file: services/openvpn/docker-compose.yml
      service: openvpn-ui
    environment:
      - OPENVPN_ADMIN_PASSWORD=password

  wireguard:
     extends:
       file: services/wireguard/docker-compose.yml
       service: wireguard
     environment:
       - WIREGUARD_PASSWORD=strongpassword

  wireguard-amnezia:
    extends:
      file: services/wireguard/docker-compose.yml
      service: wireguard-amnezia
    environment:
      - WIREGUARD_PASSWORD=strongpassword

  proxy-local:
    hostname: proxy-local.antizapret
    extends:
      file: services/proxy/compose.yml
      service: proxy
    environment:
      # Use strong password because HTTPS proxy available from internet
      - PROXY_LOGIN=
      - PROXY_PASSWORD=
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [ node.labels.location == local ]

  proxy-world:
    hostname: proxy-world.antizapret
    extends:
      file: services/proxy/compose.yml
      service: proxy
    environment:
      # Use strong password because HTTPS proxy available from internet
      - PROXY_LOGIN=
      - PROXY_PASSWORD=
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [ node.labels.location == world ]

  az-local:
    environment:
      - WARP_ENABLED=1
      # ---------------------------------------------------------------------------
      # IPv6 egress via Tundra-NAT64 (optional, disabled by default)
      # ---------------------------------------------------------------------------
      # To enable IPv6 egress for az-local (Singlebox mode), uncomment the lines
      # below and point TUNDRA_SOCKET at the Tundra-NAT64 external mapping
      # protocol Unix socket.
      #
      # - TUNDRA_SOCKET=/run/tundra/tundra.sock   # Tundra-NAT64 mapping protocol socket
      # - TUNDRA_INTERFACE=tundra                 # Tundra TUN interface
      # ---------------------------------------------------------------------------
      - WARP_PROTOCOL=WireGuard
      - WARP_PORT=500

  # az-world:
  #   environment:
  #     - WARP_ENABLED=1
  #     # ---------------------------------------------------------------------------
  #     # IPv6 egress via Tundra-NAT64 for az-world (Docker Swarm world node only)
  #     # ---------------------------------------------------------------------------
  #     # To enable IPv6 egress for az-world in Swarm mode, uncomment the az-world
  #     # service above and the lines below.
  #     #
  #     # - TUNDRA_SOCKET=/run/tundra/tundra.sock   # Tundra-NAT64 mapping protocol socket
  #     # - TUNDRA_INTERFACE=tundra                 # Tundra TUN interface
  #     # SWARM REQUIREMENT: compose.swarm.yml cannot automatically create a
  #     # dual-stack docker_gwbridge. The administrator must pre-create
  #     # docker_gwbridge with IPv6 enabled on every Swarm node and ensure
  #     # /dev/net/tun is accessible inside the container.
  #     # Run ./scripts/setup-swarm-ipv6-egress.sh --check / --apply on each node.
  #     # ---------------------------------------------------------------------------
