services:
  adguard:
    environment:
      - ADGUARDHOME_USERNAME=admin
      - ADGUARDHOME_PASSWORD=password

  https:
    environment:
      # If not set, will be created and used self-signed certificate
      - PROXY_DOMAIN=
      # If not set, will be created and used self-signed certificate
      - PROXY_EMAIL=

  # cloak:
  #   extends:
  #     file: services/cloak/docker-compose.yml
  #     service: cloak

  dashboard:
    extends:
      file: services/dashboard/docker-compose.yml
      service: dashboard
    environment:
      - DASHBOARD_USERNAME=admin
      - DASHBOARD_PASSWORD=password

  filebrowser:
    extends:
      file: services/filebrowser/docker-compose.yml
      service: filebrowser
    environment:
      - FILEBROWSER_USERNAME=admin
      - FILEBROWSER_PASSWORD=password

  openvpn:
    extends:
      file: services/openvpn/docker-compose.yml
      service: openvpn
    # To use OZON08 fork instead of default d3vilh image:
    # build:
    #   args:
    #     OPENVPN_SERVER_IMAGE: ozon08/openvpn-server:latest
    depends_on:
      - openvpn-ui

  openvpn-ui:
    extends:
      file: services/openvpn/docker-compose.yml
      service: openvpn-ui
    # To use OZON08 fork instead of default d3vilh image:
    # build:
    #   args:
    #     OPENVPN_UI_IMAGE: ozon08/openvpn-ui:latest
    environment:
      - OPENVPN_ADMIN_PASSWORD=password

  wireguard:
     extends:
       file: services/wireguard/docker-compose.yml
       service: wireguard
     environment:
       - WIREGUARD_PASSWORD=strongpassword

  wireguard-amnezia:
    extends:
      file: services/wireguard/docker-compose.yml
      service: wireguard-amnezia
    environment:
      - WIREGUARD_PASSWORD=strongpassword

  proxy-local:
    hostname: proxy-local.antizapret
    extends:
      file: services/proxy/compose.yml
      service: proxy
    environment:
      # Use strong password because HTTPS proxy available from internet
      - PROXY_LOGIN=
      - PROXY_PASSWORD=
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [ node.labels.location == local ]

  proxy-world:
    hostname: proxy-world.antizapret
    extends:
      file: services/proxy/compose.yml
      service: proxy
    environment:
      # Use strong password because HTTPS proxy available from internet
      - PROXY_LOGIN=
      - PROXY_PASSWORD=
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [ node.labels.location == world ]
