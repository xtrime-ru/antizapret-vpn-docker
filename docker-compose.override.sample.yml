services:
  adguard:
    environment:
      - ADGUARDHOME_USERNAME=admin
      - ADGUARDHOME_PASSWORD=password

  https:
    environment:
      # Optional domain for HTTPS services. Public IPv4 is used when empty.
      - PROXY_DOMAIN=
      # Optional Let's Encrypt account email.
      - PROXY_EMAIL=
      # Use selfsigned to disable ACME requests on local installations.
      - PROXY_CERT_MODE=auto
      # Use the staging directory while testing certificate issuance.
      # - PROXY_ACME_CA=https://acme-staging-v02.api.letsencrypt.org/directory

  # cloak:
  #   extends:
  #     file: services/cloak/docker-compose.yml
  #     service: cloak

  dashboard:
    extends:
      file: services/dashboard/docker-compose.yml
      service: dashboard
    environment:
      - DASHBOARD_USERNAME=admin
      - DASHBOARD_PASSWORD=password

  filebrowser:
    extends:
      file: services/filebrowser/docker-compose.yml
      service: filebrowser
    environment:
      - FILEBROWSER_USERNAME=admin
      - FILEBROWSER_PASSWORD=password

  ocserv:
    extends:
      file: services/ocserv/compose.yml
      service: ocserv
    environment:
      - OC_USER=admin
      - OC_USERPASS=strongpassword

  openvpn:
    extends:
      file: services/openvpn/docker-compose.yml
      service: openvpn
    # To use prebuilt OZON08 variant without local build:
    # image: xtrime/antizapret-vpn-openvpn-ozon08:latest
    depends_on:
      - openvpn-ui

  openvpn-ui:
    extends:
      file: services/openvpn/docker-compose.yml
      service: openvpn-ui
    # To use prebuilt OZON08 variant without local build:
    # image: xtrime/antizapret-vpn-openvpn-ui-ozon08:latest
    environment:
      - OPENVPN_ADMIN_PASSWORD=password

  wireguard:
     extends:
       file: services/wireguard/docker-compose.yml
       service: wireguard
     environment:
       - WIREGUARD_PASSWORD=strongpassword

  wireguard-amnezia:
    extends:
      file: services/wireguard/docker-compose.yml
      service: wireguard-amnezia
    environment:
      - WIREGUARD_PASSWORD=strongpassword

  proxy-local:
    hostname: proxy-local.antizapret
    extends:
      file: services/proxy/compose.yml
      service: proxy
    environment:
      # Use strong password because HTTPS proxy available from internet
      - PROXY_LOGIN=
      - PROXY_PASSWORD=
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [ node.labels.location == local ]

  proxy-world:
    hostname: proxy-world.antizapret
    extends:
      file: services/proxy/compose.yml
      service: proxy
    environment:
      # Use strong password because HTTPS proxy available from internet
      - PROXY_LOGIN=
      - PROXY_PASSWORD=
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [ node.labels.location == world ]
