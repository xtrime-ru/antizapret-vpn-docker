services:
  adguard:
    environment:
      - ADGUARDHOME_USERNAME=admin
      - ADGUARDHOME_PASSWORD=password

  https:
    environment:
      # If not set, will be created and used self-signed certificate
      - PROXY_DOMAIN=
      # If not set, will be created and used self-signed certificate
      - PROXY_EMAIL=

  # cloak:
  #   extends:
  #     file: services/cloak/docker-compose.yml
  #     service: cloak

  dashboard:
    extends:
      file: services/dashboard/docker-compose.yml
      service: dashboard
    environment:
      - DASHBOARD_USERNAME=admin
      - DASHBOARD_PASSWORD=password

  filebrowser:
    extends:
      file: services/filebrowser/docker-compose.yml
      service: filebrowser
    environment:
      - FILEBROWSER_USERNAME=admin
      - FILEBROWSER_PASSWORD=password

  openvpn:
    extends:
      file: services/openvpn/docker-compose.yml
      service: openvpn
    depends_on:
      - openvpn-ui

  openvpn-ui:
    extends:
      file: services/openvpn/docker-compose.yml
      service: openvpn-ui
    environment:
      - OPENVPN_ADMIN_PASSWORD=password

  wireguard:
     extends:
       file: services/wireguard/docker-compose.yml
       service: wireguard
     environment:
       - WIREGUARD_PASSWORD=strongpassword

  wireguard-amnezia:
    extends:
      file: services/wireguard/docker-compose.yml
      service: wireguard-amnezia
    environment:
      - WIREGUARD_PASSWORD=strongpassword

  socks-local:
    hostname: socks-local.antizapret
    extends:
      file: services/socks/compose.yml
      service: socks
    environment:
      # Omit SOCKS_USERNAME and SOCKS_PASSWORD to disable authentication
      - SOCKS_USERNAME=admin
      - SOCKS_PASSWORD=password
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [ node.labels.location == local ]

  socks-world:
    hostname: socks-world.antizapret
    extends:
      file: services/socks/compose.yml
      service: socks
    environment:
      # Omit SOCKS_USERNAME and SOCKS_PASSWORD to disable authentication
      - SOCKS_USERNAME=admin
      - SOCKS_PASSWORD=password
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [ node.labels.location == world ]

  http-proxy-local:
    hostname: http-proxy-local.antizapret
    extends:
      file: services/http-proxy/compose.yml
      service: http-proxy
    # Uncomment to use from Internet (CAUTION: you should set username and password below)
    # ports:
      # HTTP port
      # CAUTION: when using HTTP, your proxy's username/password will be available to everyone in the traffic route
      # - "3128:3128"
      # HTTPS port
      # - "3129:3129"
    environment:
      # When using without VPN, you should set a long login/password (12+ chars)
      # Omit HTTP_PROXY_USERNAME and HTTP_PROXY_PASSWORD to disable authentication
      - HTTP_PROXY_USERNAME=admin
      - HTTP_PROXY_PASSWORD=password
      # - HTTP_PROXY_PORT=3128
      # - HTTPS_PROXY_PORT=3129
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [ node.labels.location == local ]

  http-proxy-world:
    hostname: http-proxy-world.antizapret
    extends:
      file: services/http-proxy/compose.yml
      service: http-proxy
    # Uncomment to use from Internet (CAUTION: you should set username and password below)
    # ports:
      # HTTP port
      # CAUTION: when using HTTP, your proxy's username/password will be available to everyone in the traffic route
      # - "3128:3128"
      # HTTPS port
      # - "3129:3129"
    environment:
      # When using without VPN, you should set a long login/password (12+ chars)
      # Omit HTTP_PROXY_USERNAME and HTTP_PROXY_PASSWORD to disable authentication
      - HTTP_PROXY_USERNAME=admin
      - HTTP_PROXY_PASSWORD=password
      # - HTTP_PROXY_PORT=3128
      # - HTTPS_PROXY_PORT=3129
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [ node.labels.location == world ]
