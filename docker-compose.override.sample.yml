services:
  adguard:
    environment:
      - ADGUARDHOME_USERNAME=admin
      - ADGUARDHOME_PASSWORD=password

  https:
    environment:
      # Optional domain for HTTPS services. Public IPv4 is used when empty.
      - PROXY_DOMAIN=
      # Optional Let's Encrypt account email.
      - PROXY_EMAIL=
      # Use selfsigned to disable ACME requests on local installations.
      - PROXY_CERT_MODE=auto
      # Use the staging directory while testing certificate issuance.
      # - PROXY_ACME_CA=https://acme-staging-v02.api.letsencrypt.org/directory

  # cloak:
  #   extends:
  #     file: services/cloak/docker-compose.yml
  #     service: cloak

  dashboard:
    extends:
      file: services/dashboard/docker-compose.yml
      service: dashboard
    environment:
      - DASHBOARD_USERNAME=admin
      - DASHBOARD_PASSWORD=password

  filebrowser:
    extends:
      file: services/filebrowser/docker-compose.yml
      service: filebrowser
    environment:
      - FILEBROWSER_USERNAME=admin
      - FILEBROWSER_PASSWORD=antizapret-browser

  ocserv:
    extends:
      file: services/ocserv/compose.yml
      service: ocserv
    environment:
      - OC_USER=admin
      - OC_USERPASS=strongpassword

  openvpn:
    extends:
      file: services/openvpn/docker-compose.yml
      service: openvpn
    depends_on:
      - openvpn-ui

  openvpn-ui:
    extends:
      file: services/openvpn/docker-compose.yml
      service: openvpn-ui
    environment:
      - OPENVPN_ADMIN_PASSWORD=password

  wireguard:
     extends:
       file: services/wireguard/docker-compose.yml
       service: wireguard
     environment:
       - WIREGUARD_PASSWORD=strongpassword

  wireguard-amnezia:
    extends:
      file: services/wireguard/docker-compose.yml
      service: wireguard-amnezia
    environment:
      - WIREGUARD_PASSWORD=strongpassword

  proxy-local:
    hostname: proxy-local.antizapret
    extends:
      file: services/proxy/compose.yml
      service: proxy
    environment:
      # Use strong password because HTTPS proxy available from internet
      - PROXY_LOGIN=
      - PROXY_PASSWORD=
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [ node.labels.location == local ]

  proxy-world:
    hostname: proxy-world.antizapret
    extends:
      file: services/proxy/compose.yml
      service: proxy
    environment:
      # Use strong password because HTTPS proxy available from internet
      - PROXY_LOGIN=
      - PROXY_PASSWORD=
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints: [ node.labels.location == world ]

  az-local:
    environment:
      - WARP_ENABLED=1
      # ---------------------------------------------------------------------------
      # Selective IPv6 Egress (optional, disabled by default)
      # ---------------------------------------------------------------------------
      # To enable IPv6 egress for az-local (Singlebox mode), uncomment the lines
      # below and configure the domains in config/antizapret/custom/ipv6-egress-domains-local.txt.
      # The IPv6 Docker network is created automatically by docker-compose.yml
      # (enable_ipv6: true); no manual docker network create is required.
      #
      # IPV6_EGRESS_LOCAL_ENABLED=1   # Enable IPv6 egress on az-local (0=off, 1=on)
      # IPV6_EGRESS_LOCAL_FILE=/root/antizapret/config/custom/ipv6-egress-domains-local.txt
      # IPV6_EGRESS_LOCAL_MODE=adguard_only   # adguard_only | file_only | adguard_with_file_fallback
      # IPV6_EGRESS_LOCAL_RESERVE_COUNT=100   # Virtual IPv4 addresses reserved for IPv6 egress pool
      # IPV6_TRANSLATOR_LOCAL_PORT=9000       # Port for the local IPv4→IPv6 translator
      # ---------------------------------------------------------------------------

  # az-world:
  #   environment:
  #     - WARP_ENABLED=1
  #     # ---------------------------------------------------------------------------
  #     # Selective IPv6 Egress for az-world (Docker Swarm world node only)
  #     # ---------------------------------------------------------------------------
  #     # To enable IPv6 egress for az-world in Swarm mode, uncomment the az-world
  #     # service above and the lines below. Configure domains in
  #     # config/antizapret/custom/ipv6-egress-domains-world.txt.
  #     #
  #     # IPV6_EGRESS_WORLD_ENABLED=1   # Enable IPv6 egress on az-world (0=off, 1=on)
  #     # IPV6_EGRESS_WORLD_FILE=/root/antizapret/config/custom/ipv6-egress-domains-world.txt
  #     # IPV6_EGRESS_WORLD_MODE=adguard_only   # adguard_only | file_only | adguard_with_file_fallback
  #     # IPV6_EGRESS_WORLD_RESERVE_COUNT=100   # Virtual IPv4 addresses reserved for IPv6 egress pool
  #     # IPV6_TRANSLATOR_WORLD_PORT=9000       # Port for the world IPv4→IPv6 translator
  #     # ---------------------------------------------------------------------------
